name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Lint if configured
        run: |
          if command -v ruff >/dev/null 2>&1; then
            ruff check .
          elif command -v flake8 >/dev/null 2>&1; then
            flake8 .
          else
            echo "No ruff or flake8 configuration detected; skipping lint."
          fi
      - name: Type check
        run: echo "No Python type checker is configured for this repo."
      - name: Unit tests
        run: python -m pytest
      - name: Import smoke
        run: |
          python -m compileall src tests
          python - <<'PY'
          import src.validation.validators
          import src.semantic_layer.schema_registry
          import src.semantic_layer.metric_registry
          import src.runtime.pipeline
          PY
      - name: Dependency vulnerability check
        run: |
          python -m pip install pip-audit
          pip-audit
