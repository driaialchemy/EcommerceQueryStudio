[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mavenfuzzyfactory"
version = "0.1.0"
description = "Governed ecommerce analytics MVP for the Maven Fuzzy Factory dataset."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb",
    "pandas",
    "pyyaml",
    "pytest",
    "streamlit",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

